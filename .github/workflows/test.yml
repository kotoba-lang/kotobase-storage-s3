name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - run: npm ci

      # nbb rather than `cljs.main -re node`: that runner does not
      # propagate the script's exit code, so a failing suite exited 0 and
      # this gate would have been green forever. Checked by breaking a
      # check on purpose.
      # Two suites. The second runs the contract through `r2-client` against
      # a real R2Bucket binding -- a path the mock never touches, and the
      # one that found the probe sending a quoted ETag R2 rejects outright.
      - name: contract + adapter checks
        run: npm test
